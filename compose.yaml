services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: watchtower
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
    ports:
      - "5432:5432"
    volumes:
      - watchtower_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchtower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  watchtower_postgres:
